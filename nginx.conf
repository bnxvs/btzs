server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # Сжатие статики.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ВАЖНО: `add_header` в блоке `location` перекрывает заголовки из `server`.
    # Внешний nginx 1.27 не умеет `add_header_inherit merge`, поэтому набор
    # заголовков безопасности повторяется в каждом блоке, где есть `add_header`.
    # CSP намеренно не задаётся: приложение использует inline-стили и blob:-ссылки.

    # Точка проверки работоспособности для HEALTHCHECK и балансировщиков.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Хешированные имена ассетов Vite неизменяемы — кешируем надолго.
    location /assets/ {
        access_log off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # index.html не кешируем, чтобы обновления подхватывались сразу после деплоя.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # SPA: любой неизвестный путь отдаёт приложение (маршрутизация — в приложении).
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }
}
