schema: spec-driven

context: |
  Language: Russian
  All prose must be written in Russian.
  Keep OpenSpec structural headings and the SHALL/MUST requirement keywords in English.
  Target: cross-platform web application (React + TypeScript) packaged for macOS.
  Source of truth: reverse-engineered "Plotter for Windows" v1.2 (BTZS Software / Phil Davis).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
