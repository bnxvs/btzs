[package]
name = "plotter"
version = "1.2.0"
description = "Cross-platform port of Plotter for Windows (BTZS Software)"
authors = ["Plotter port"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "plotter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
