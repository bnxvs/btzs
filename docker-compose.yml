# Продакшен-развёртывание Plotter (веб-версия) на VPS.
#
#   docker compose up -d --build
#
# Приложение — статическая SPA: контейнер только раздаёт файлы через nginx,
# серверной части и базы данных нет. Параметры — в файле `.env`
# (см. .env.example).
#
# TLS/reverse proxy здесь НЕ поднимается: его выполняет Nginx Proxy Manager.
# Порт публикуется на хост, и NPM проксирует на `127.0.0.1:<PLOTTER_PORT>`
# (см. README, раздел «Прокси и HTTPS»).

name: plotter

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Версия попадает в лейблы образа (см. Dockerfile).
        APP_VERSION: "1.2.0"
    image: btzs/plotter:1.2.0
    restart: unless-stopped
    ports:
      # Публикуем на loopback: снаружи виден только через NPM (который видит
      # этот порт, т.к. запущен с network_mode: host). Для прямого доступа
      # извне поставьте PLOTTER_BIND=0.0.0.0 в .env.
      - "${PLOTTER_BIND:-127.0.0.1}:${PLOTTER_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
